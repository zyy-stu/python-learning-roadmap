<script>
'use strict';
const {domains, edges} = JSON.parse(document.querySelector('#dataset').textContent);
const $ = id => document.getElementById(id);
const nodes = new Map();
const incoming = new Map();
const outgoing = new Map();
function register(node, root, parent = null) {
  node.root = root;
  node.parent = parent;
  node.level = parent ? parent.level + 1 : 1;
  nodes.set(node.id, node);
  node.children.forEach(child => register(child, root, node));
}
domains.forEach(root => register(root, root));
function addEdge(index, id, other, reason) {
  if (!index.has(id)) index.set(id, []);
  index.get(id).push({node: nodes.get(other), reason});
}
edges.forEach(([from, to, reason]) => {
  addEdge(incoming, to, from, reason);
  addEdge(outgoing, from, to, reason);
});
function element(tag, text, className) {
  const item = document.createElement(tag);
  if (text) item.textContent = text;
  if (className) item.className = className;
  return item;
}
function button(text, action, className) {
  const item = element('button', text, className);
  item.type = 'button';
  item.addEventListener('click', action);
  return item;
}
const levels = ['','领域','模块','主题','知识点'];
const opened = new Set();
let scope = 'all';
let selected;
let results = new Set();
let branches = new Set();
$('domain').add(new Option('全部领域', 'all'));
domains.forEach(node => $('domain').add(new Option(node.name, node.id)));
$('stats').textContent = domains.length + ' 个领域 · ' + nodes.size + ' 个目录节点 · ' + edges.length + ' 条前置关系';
function renderTree() {
  const query = $('query').value.trim().toLowerCase();
  const roots = scope === 'all' ? domains : [nodes.get(scope)];
  results = new Set();
  branches = new Set();
  function mark(node) {
    const matches = !query || [node.name, node.id, node.root.repo].some(value => value.toLowerCase().includes(query));
    if (matches) results.add(node.id);
    let visible = matches;
    for (const child of node.children) {
      if (mark(child)) visible = true;
    }
    if (visible) branches.add(node.id);
    return visible;
  }
  roots.forEach(mark);
  function list(items) {
    const ul = element('ul');
    for (const node of items) {
      if (!branches.has(node.id)) continue;
      const li = element('li');
      const row = element('div', '', 'row');
      const children = node.children.filter(child => branches.has(child.id));
      if (children.length) {
        const control = button(opened.has(node.id) ? '−' : '+', () => {
          if (opened.has(node.id)) opened.delete(node.id); else opened.add(node.id);
          renderTree();
          document.getElementById('toggle-' + node.id).focus();
        }, 'toggle');
        control.id = 'toggle-' + node.id;
        control.setAttribute('aria-label', '展开或收起 ' + node.name);
        control.setAttribute('aria-expanded', String(opened.has(node.id)));
        row.append(control);
      }
      const entry = button(node.id + ' ' + node.name, () => select(node, 'tree'), 'node');
      entry.id = 'node-' + node.id;
      if (selected === node) entry.setAttribute('aria-current', 'true');
      row.append(entry);
      li.append(row);
      if (children.length && opened.has(node.id)) li.append(list(children));
      ul.append(li);
    }
    return ul;
  }
  $('tree').replaceChildren(list(roots));
  $('status').textContent = results.size ? (query ? '匹配 ' : '共 ') + results.size + ' 个节点' : '未找到匹配的节点';
}
function path(node) {
  const parents = [];
  for (let item = node.parent; item; item = item.parent) parents.unshift(item);
  return parents;
}
function jump(node) {
  select(node, 'detail');
}
function renderDetail(node) {
  const crumbs = element('nav', '', 'crumbs');
  crumbs.setAttribute('aria-label', '上级节点');
  path(node).forEach(parent => crumbs.append(button(parent.name, () => jump(parent)), element('span', ' / ')));
  const heading = element('h2', node.name);
  heading.id = 'selected-heading';
  heading.tabIndex = -1;
  const meta = element('p', [node.id, levels[node.level], node.root.repo, node.children.length + ' 个直接下级'].join(' · '), 'meta');
  const graph = element('div', '', 'graph');
  const column = (title, connections) => {
    const list = element('div', '', 'column');
    list.append(element('strong', title));
    if (!connections.length) list.append(element('span', '暂未标注', 'small'));
    for (const entry of connections) {
      const link = button(entry.node.name, () => jump(entry.node), 'edge');
      link.append(element('span', entry.reason, 'why'));
      list.append(link);
    }
    return list;
  };
  graph.append(column('前置知识 →', incoming.get(node.id) || []),
    element('div', node.name, 'focus'),
    column('→ 后续知识', outgoing.get(node.id) || []));
  const detail = $('detail');
  detail.replaceChildren(crumbs, heading, meta, element('h3', '学习依赖'), graph);
  if (node.children.length) {
    const children = element('div', '', 'jump');
    node.children.forEach(child => children.append(button(child.name, () => jump(child))));
    detail.append(element('h3', '直接下级'), children);
  }
  detail.append(element('p', '箭头表示建议的学习顺序。当前依赖标注到主题级。', 'note'));
}
function select(node, focus = '') {
  if (scope !== 'all' && scope !== node.root.id) {
    scope = node.root.id;
    $('domain').value = scope;
  }
  if (focus !== 'tree') $('query').value = '';
  selected = node;
  history.replaceState(null, '', '#' + node.id);
  path(node).forEach(parent => opened.add(parent.id));
  renderTree();
  renderDetail(node);
  if (focus === 'tree') $('node-' + node.id)?.focus();
  if (focus === 'detail') $('selected-heading').focus();
}
$('domain').addEventListener('change', event => {
  scope = event.target.value;
  const root = scope === 'all' ? selected.root : nodes.get(scope);
  opened.add(root.id);
  select(root);
});
$('query').addEventListener('input', () => {
  const query = $('query').value.trim().toLowerCase();
  if (query) for (const node of nodes.values()) {
    if ([node.name, node.id, node.root.repo].some(value => value.toLowerCase().includes(query))) {
      path(node).forEach(parent => opened.add(parent.id));
    }
  }
  renderTree();
});
$('expand').addEventListener('click', () => {
  branches.forEach(id => { if (nodes.get(id).children.length) opened.add(id); });
  renderTree();
});
$('collapse').addEventListener('click', () => { opened.clear(); renderTree(); });
[['02.02.01','作用域与闭包'],['03.03.03','协程与异步接口'],['05.08.03','检索增强生成']].forEach(([id, title]) => $('samples').append(button(title, () => jump(nodes.get(id)))));
function selectFromLocation() {
  const node = nodes.get(location.hash.slice(1)) || nodes.get('02.02.01');
  if (node.children.length) opened.add(node.id);
  select(node);
}
window.addEventListener('hashchange', () => {
  if (nodes.has(location.hash.slice(1))) selectFromLocation();
});
selectFromLocation();
</script>
